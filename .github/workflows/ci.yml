name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build the app
        run: ./build.sh
      - name: Package the disk image
        run: ./package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Spotify-Notch
          path: dist/Spotify-Notch.dmg
